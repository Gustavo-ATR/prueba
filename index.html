<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente Interactivo de Literatura Técnica</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .main-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .header-tag {
      display: inline-block;
      background: #0284c7;
      color: #e0f2fe;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 15px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #f1f5f9; }
    p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
    .avatar-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 0 auto 25px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .glow-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, rgba(15, 23, 42, 0) 70%);
      transition: all 0.3s ease;
    }
    .avatar-box {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: #0f172a;
      border: 3px solid #38bdf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transition: all 0.3s ease;
    }
    .book-icon { font-size: 60px; margin-bottom: 5px; user-select: none; }
    .avatar-label { font-size: 0.8rem; font-weight: 600; color: #38bdf8; }
    
    .speaking .glow-ring {
      animation: pulse-ring 1.2s infinite ease-in-out;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.6) 0%, rgba(15, 23, 42, 0) 70%);
    }
    .speaking .avatar-box {
      border-color: #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
      transform: scale(1.05);
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.6; }
    }
    .transcript-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      margin-bottom: 20px;
      min-height: 50px;
      max-height: 80px;
      overflow-y: auto;
      font-size: 0.85rem;
      color: #cbd5e1;
      text-align: left;
    }
    .config-box {
      background: #0f172a;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 20px;
      text-align: left;
    }
    .config-box label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; font-weight: 600; }
    .config-box input {
      width: 100%;
      padding: 10px;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }
    .controls { display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-start { background: #0284c7; color: #ffffff; }
    .btn-start:hover { background: #0369a1; }
    .btn-stop { background: #334155; color: #94a3b8; }
    .btn-stop:hover:not(:disabled) { background: #dc2626; color: #fff; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-bar {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .status-dot.active { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.error { background: #ef4444; }
  </style>
</head>
<body>

  <div class="main-card">
    <span class="header-tag">Google AI Studio • Voice Agent</span>
    <h1>Libro Técnico de Taller</h1>
    <p class="subtitle">Asistente conversacional para metrología y mecánica</p>

    <div id="avatarWrapper" class="avatar-wrapper">
      <div class="glow-ring"></div>
      <div class="avatar-box">
        <div class="book-icon">📘</div>
        <div class="avatar-label">MANUAL TÉCNICO</div>
      </div>
    </div>

    <div class="transcript-box" id="transcript">
      <i>Presiona "Hablar con el Personaje" y realiza tu pregunta...</i>
    </div>

    <div class="config-box">
      <label for="apiKeyInput">API Key de Google AI Studio:</label>
      <input type="password" id="apiKeyInput" placeholder="Pega aquí tu API Key (AQ...)">
    </div>

    <div class="controls">
      <button id="startBtn" class="btn-start">Hablar con el Personaje</button>
      <button id="stopBtn" class="btn-stop" disabled>Detener Voz</button>
    </div>

    <div class="status-bar">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Estado: Listo</span>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const avatarWrapper = document.getElementById('avatarWrapper');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const transcript = document.getElementById('transcript');

    const SYSTEM_INSTRUCTION = `Eres el "Manual Técnico de Taller", un personaje experto en literatura técnica de mecánica, metrología de vehículos y motores diésel de carga pesada. Respondes a las preguntas de los técnicos y estudiantes de forma muy clara, concisa, didáctica y con tono profesional. Mantén respuestas breves (máximo 2 o 3 frases) aptas para ser escuchadas.`;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let synth = window.speechSynthesis;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'es-ES';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        updateStatus("Escuchando tu pregunta...", "active");
        transcript.innerText = "Escuchando...";
      };

      recognition.onresult = async (event) => {
        const userText = event.results[0][0].transcript;
        transcript.innerHTML = `<b>Tú:</b> ${userText}`;
        updateStatus("Pensando respuesta...", "warning");
        await askGemini(userText);
      };

      recognition.onerror = (event) => {
        console.error("Error de reconocimiento:", event.error);
        updateStatus("Error de micrófono o voz no detectada", "error");
        resetControls();
      };

      recognition.onend = () => {
        startBtn.disabled = false;
      };
    } else {
      alert("Tu navegador no soporta reconocimiento de voz. Usa Google Chrome o Microsoft Edge.");
    }

    startBtn.addEventListener('click', () => {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Por favor ingresa tu API Key de Google AI Studio.");
        return;
      }
      if (synth.speaking) synth.cancel();
      startBtn.disabled = true;
      stopBtn.disabled = false;
      recognition.start();
    });

    async function askGemini(question) {
      const apiKey = apiKeyInput.value.trim();
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;

      const payload = {
        contents: [
          {
            role: "user",
            parts: [{ text: `${SYSTEM_INSTRUCTION}\n\nPregunta del estudiante: ${question}` }]
          }
        ]
      };

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
          const aiReply = data.candidates[0].content.parts[0].text;
          transcript.innerHTML += `<br><b>Manual:</b> ${aiReply}`;
          speak(aiReply);
        } else {
          updateStatus("Error en la respuesta de la API", "error");
          console.error(data);
        }
      } catch (err) {
        console.error("Error al conectar con Gemini:", err);
        updateStatus("Error de red o API Key inválida", "error");
      }
    }

    function speak(text) {
      if (!synth) return;
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'es-ES';
      utterance.rate = 1.0;
      utterance.pitch = 0.9;

      utterance.onstart = () => {
        avatarWrapper.classList.add('speaking');
        updateStatus("Hablando...", "active");
      };

      utterance.onend = () => {
        avatarWrapper.classList.remove('speaking');
        updateStatus("Listo para la siguiente pregunta", "inactive");
        resetControls();
      };

      synth.speak(utterance);
    }

    function updateStatus(message, state) {
      statusText.innerText = `Estado: ${message}`;
      statusDot.className = "status-dot";
      if (state === "active") statusDot.classList.add("active");
      if (state === "error") statusDot.classList.add("error");
    }

    function resetControls() {
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    stopBtn.addEventListener('click', () => {
      if (synth.speaking) synth.cancel();
      if (recognition) recognition.stop();
      avatarWrapper.classList.remove('speaking');
      updateStatus("Detenido", "inactive");
      resetControls();
    });
  </script>
</body>
</html>
